<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- バグるLINE引き継ぎは 2026-11-05 に https://t3dining-store.github.io/baguru-line/ へ引っ越した（お店用アプリの引っ越し。../../お店用アプリの引っ越し.md）。
     前のアドレス（https://t3dining.github.io/baguru-line/）は、公式アプリと保存場所が同じなので、開いたら、ここに残ったお店の保存を消して、新しいアドレスへのボタンを出す。
     ★自動では移らない（ホーム画面のアイコンを入れ直してもらうため）。公開の道具が、前の公開先 t3dining/baguru-line に index.html として出す -->
<title>バグるLINE引き継ぎ</title>
<script>
  (function () {
    // ★お店用アプリの引っ越し.md の「古い場所で消すもの」を全部、名前で1つずつ消す（社員のスマホは、1つの古いアイコンしか開かないことがある）。
    //   bg. で始まる名前は、公式アプリのお客様の保存にも使っているので、まとめて消さない
    var names = ['baguru.daicho.pin', 'baguru.daicho.seen', 'baguru.daicho.sound', 'baguru.daicho.shell', 'baguru.line.screen',
      'bg.hpAdmin', 'baguru.yoyaku.owner', 'baguru.yoyaku.view', 'bg.cookRung', 'bg.hub', 'bg.owner'];
    [function () { return localStorage; }, function () { return sessionStorage; }].forEach(function (box) {
      try { var b = box(); names.forEach(function (k) { b.removeItem(k); }); } catch (e) {}
    });
    // 前のアドレスのサービスワーカーを外す
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { if (new URL(r.scope).pathname.indexOf('/baguru-line/') === 0) r.unregister(); });
    }).catch(function () {});
  })();
</script>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#faf6f0;color:#221c18;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;text-align:center;line-height:1.7">
<div style="max-width:420px">
  <p style="font-size:20px;font-weight:700;margin:0 0 12px">バグるLINE引き継ぎは、<br>新しいアドレスに引っ越しました</p>
  <p style="margin:0 0 8px;color:#675d55">ホーム画面に入れているときは、このアイコンを消して、新しいアドレスから入れ直してください。</p>
  <p style="margin:0 0 24px;color:#675d55">合言葉は、新しいアドレスでもう一度入れてください。</p>
  <a id="go" href="https://t3dining-store.github.io/baguru-line/" style="display:inline-block;padding:14px 32px;border-radius:999px;background:#c7361d;color:#fff;font-size:17px;font-weight:700;text-decoration:none">新しいアドレスで開く</a>
</div>
<script>document.getElementById('go').href += location.search;   // バグる Owner・Staff から開いた印（?from=owner など）は、そのまま渡す</script>
</body>
</html>
